[package]
name = "mpmb-reader"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
lopdf = { version = "0.46", default-features = false }
ttf-parser = "0.25"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.dev]
debug = 0

[profile.dev.package.lopdf]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2
