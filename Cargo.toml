[package]
name = "mpmb-reader"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/AFAskar/MPMPAcrobatLinux"

[dependencies]
anyhow = "1"
lopdf = { version = "0.46", default-features = false }
rquickjs = "0.14"
quick-xml = "0.41"
ttf-parser = "0.25"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 0

[profile.dev.package.lopdf]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2
