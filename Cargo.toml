[package]
name = "mpmb-reader"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
lopdf = { version = "0.46", default-features = false }
rquickjs = "0.14"
ttf-parser = "0.25"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

[profile.dev.package.lopdf]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2
