apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpmb-reader
  labels:
    app.kubernetes.io/name: mpmb-reader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mpmb-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mpmb-reader
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mpmb-reader
          image: localhost/mpmb-reader:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MPMB_SERVE_BIND
              value: "0.0.0.0:8080"
            - name: MPMB_DATA_DIR
              value: "/data/sheets"
            - name: MPMB_GIT_AUTO_SYNC_SECS
              value: "300"
            - name: MPMB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mpmb-git-config
                  key: MPMB_AUTH_TOKEN
                  optional: false
          envFrom:
            - secretRef:
                name: mpmb-git-config
                optional: true
          volumeMounts:
            - name: sheets
              mountPath: /data/sheets
            - name: tmp
              mountPath: /tmp
            - name: git-ssh-key
              mountPath: /etc/mpmb-git
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: sheets
          persistentVolumeClaim:
            claimName: mpmb-sheets
        - name: tmp
          emptyDir: {}
        - name: git-ssh-key
          secret:
            secretName: mpmb-git-ssh
            defaultMode: 0400
            optional: true
