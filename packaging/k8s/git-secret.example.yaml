# Example Kubernetes Secrets for connecting mpmb-reader serve to a PRIVATE GitHub
# repository. Encrypt with SOPS before committing to your GitOps repository;
# never commit plaintext keys or tokens.
apiVersion: v1
kind: Secret
metadata:
  name: mpmb-git-config
  namespace: mpmb
type: Opaque
stringData:
  MPMB_GIT_REPO: "git@github.com:YOUR_USER/mpmb-characters-private.git"
  MPMB_GIT_BRANCH: "main"
  MPMB_GIT_SSH_KEY: "/etc/mpmb-git/id_ed25519"
  MPMB_GIT_AUTHOR_NAME: "MPMB Reader"
  MPMB_GIT_AUTHOR_EMAIL: "mpmb-reader@example.com"
  # Optional bearer/query token protecting the PWA and API endpoints:
  # MPMB_AUTH_TOKEN: "replace-with-random-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: mpmb-git-ssh
  namespace: mpmb
type: Opaque
stringData:
  id_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_WITH_GITHUB_WRITE_DEPLOY_KEY
    -----END OPENSSH PRIVATE KEY-----
