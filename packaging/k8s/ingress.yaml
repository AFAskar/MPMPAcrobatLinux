apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mpmb-reader
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mpmb.example.internal
  rules:
    - host: mpmb.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mpmb-reader
                port:
                  number: 80
